# Cloudflare Worker for KULVEER.AI
# No secrets live here. The AI binding is authenticated via your Cloudflare
# account (wrangler login) — never put API tokens in this file or the repo.

name = "kulveer-ai"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Workers AI binding — requires a Cloudflare account (free tier gives 10,000
# neurons/day at no charge). No credential values in this file.
[ai]
binding = "AI"

# Which Workers AI model to use. Default is a Free-allocation-friendly,
# Cloudflare-hosted text-generation model (not in the paid-only list).
[vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

# Runs on the public *.workers.dev URL by default (workers_dev = true).
[observability]
enabled = true
