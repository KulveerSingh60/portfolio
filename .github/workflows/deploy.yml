name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify VITE_AI_API_URL is present
        run: |
          if [ -n "$VITE_AI_API_URL" ]; then
            echo "VITE_AI_API_URL is set (length ${#VITE_AI_API_URL}, not printed)"
            echo "VITE_AI_API_URL_LENGTH=${#VITE_AI_API_URL}" >> "$GITHUB_ENV"
          else
            echo "::error::VITE_AI_API_URL is not set. Set a repository variable named VITE_AI_API_URL (GitHub > Settings > Secrets and variables > Actions > Variables) to the deployed Cloudflare Worker URL."
            exit 1
          fi
        env:
          # Public endpoint (not a secret) used only to configure the build.
          VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL }}

      - name: Build
        run: npm run build
        env:
          # Public endpoint (not a secret) used only to configure the build.
          VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
